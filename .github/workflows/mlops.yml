name: MLOps CI/CD Pipeline

# Menjalankan workflow ketika ada perubahan kode
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Mengambil source code repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # STEP 2: Menyiapkan Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      # STEP 3: Menginstal dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # STEP 4: Automated Testing (CI)
      - name: Run automated tests
        run: python -m pytest tests/ -v

      # STEP 5: Training dan API testing (CD)
      # Hanya dilakukan ketika perubahan masuk branch main
      - name: Train and validate model
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RUN_FINAL_TEST: "false"
        run: |
          # Menjalankan MLflow Server
          mlflow server --backend-store-uri sqlite:///mlflow.db --port 5000 > mlflow.log 2>&1 &
          MLFLOW_PID=$!

          trap 'kill "$MLFLOW_PID" 2>/dev/null || true' EXIT

          # Menunggu MLflow Server siap
          for i in {1..60}; do
            if curl -fs http://127.0.0.1:5000/health; then
              break
            fi
            sleep 2
          done

          curl -f http://127.0.0.1:5000/health

          # Melatih dan menyimpan model
          python train.py

          # Menjalankan FastAPI Server
          python -m uvicorn api:app --port 8000 > api.log 2>&1 &
          API_PID=$!

          trap 'kill "$MLFLOW_PID" "$API_PID" 2>/dev/null || true' EXIT

          # Menunggu API Server siap
          for i in {1..60}; do
            if curl -fs http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done

          # Memastikan API berjalan
          curl -f http://127.0.0.1:8000/health

          # Menguji endpoint prediksi
          python - <<'PY'
          import pandas as pd
          import requests

          df = pd.read_csv("datasets/online_shoppers_intention.csv")
          X = df.drop(columns=["Revenue", "PageValues"])

          response = requests.post(
              "http://127.0.0.1:8000/predict",
              json=X.head(1).to_dict("records")[0],
              timeout=10
          )

          response.raise_for_status()

          result = response.json()

          assert result["prediction"] in [0, 1]
          assert 0 <= result["purchase_probability"] <= 1

          print("API prediction test passed!")
          PY

      # STEP 6: Menyimpan model dan aplikasi siap dirilis
      - name: Upload release artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: online-shopping-model
          path: |
            models/best_model.joblib
            api.py
            requirements.txt
          if-no-files-found: error
